[package]
name = "vmk-studio"
version = "0.4.0"
description = "VMK Studio - Custom-firmware-aware ZMK Studio fork"
authors = ["VMK Studio Contributors", "The ZMK Contributors"]
license = "Apache-2.0"
repository = "https://github.com/hauntedfail/vmk_studio"
default-run = "vmk-studio"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0.0", features = [] }
bluest = { git = "https://github.com/alexmoon/bluest.git", rev = "de787d02a45dbc93ef9bbff6e387dc31651ec882", features = ["serde"] }
async-std = "1.12.0"
uuid = "1.6.1"
futures = "0.3.30"
blocking = "1.6.0"
tokio-serial = { version ="5.4.1", features = ["libudev"] }
serialport = "4.5.0"
tokio = { version = "1.37.0", features = ["io-util"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["clock"] }

[features]
custom-protocol = [ "tauri/custom-protocol" ]

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-cli = "2.0.0"
