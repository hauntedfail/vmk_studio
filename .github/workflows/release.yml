name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify bundles without creating a GitHub Release"
        type: boolean
        default: true
      expected_version:
        description: "Optional version to verify (e.g. 0.4.0)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight Gate (Frontend + Version Sync)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify version sync and changelog
        id: version
        run: |
          PKG_VER="$(node -p "require('./package.json').version")"
          echo "version=${PKG_VER}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            node scripts/check-version-sync.mjs --require-changelog --tag "${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.expected_version }}" ]]; then
            echo "tag=v${{ inputs.expected_version }}" >> "$GITHUB_OUTPUT"
            node scripts/check-version-sync.mjs --require-changelog --tag "v${{ inputs.expected_version }}"
          else
            echo "tag=v${PKG_VER}" >> "$GITHUB_OUTPUT"
            node scripts/check-version-sync.mjs --require-changelog
          fi

      - name: Type-check, lint, test, build, and smoke-test
        run: |
          npm run typecheck
          npm run lint:vmk
          npm test
          npm run build
          node scripts/smoke-preview.mjs

  rust-gate:
    name: Rust Gate (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri system dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            libdbus-1-dev \
            libssl-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Rust fmt, Clippy, and unit tests
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

  build-bundles:
    name: Build Desktop Bundle (${{ matrix.name }})
    needs: [preflight, rust-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            tauri_args: "--target universal-apple-darwin"
          - name: linux-x64
            os: ubuntu-24.04
            rust_targets: ""
            tauri_args: "--bundles deb"
          - name: windows-x64
            os: windows-latest
            rust_targets: ""
            tauri_args: "--bundles nsis,msi"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri system dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            libdbus-1-dev \
            libssl-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri application bundles (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CI: "true"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!var:-}" ]]; then
              unset "$var"
            fi
          done
          npm run tauri build -- ${{ matrix.tauri_args }}

      - name: Build Tauri application bundles (Windows)
        if: runner.os == 'Windows'
        env:
          CI: "true"
        run: npm run tauri build -- ${{ matrix.tauri_args }}

      - name: Collect release assets and checksums (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob

          if [[ "${{ matrix.name }}" == "macos-universal" ]]; then
            for f in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
              cp "$f" release-assets/
            done
            for app in src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app; do
              tar -czf "release-assets/VMK-Studio_${{ needs.preflight.outputs.version }}_universal-macos.app.tar.gz" \
                -C "$(dirname "$app")" "$(basename "$app")"
            done
          elif [[ "${{ matrix.name }}" == "linux-x64" ]]; then
            for f in src-tauri/target/release/bundle/deb/*.deb; do
              cp "$f" release-assets/
            done
          fi

          ls -la release-assets
          test "$(ls -A release-assets)"
          (
            cd release-assets
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum * > "SHA256SUMS-${{ matrix.name }}.txt"
            else
              shasum -a 256 * > "SHA256SUMS-${{ matrix.name }}.txt"
            fi
          )
          cat "release-assets/SHA256SUMS-${{ matrix.name }}.txt"

      - name: Collect release assets and checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination release-assets
          Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Copy-Item -Destination release-assets
          $files = Get-ChildItem -Path release-assets -File
          if ($files.Count -eq 0) { throw "No Windows release bundles produced" }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLowerInvariant()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content -Encoding utf8 -Path "release-assets/SHA256SUMS-${{ matrix.name }}.txt"
          Get-Content "release-assets/SHA256SUMS-${{ matrix.name }}.txt"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vmk-studio-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  draft-release:
    name: Create Draft GitHub Release
    needs: [preflight, rust-gate, build-bundles]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vmk-studio-*
          merge-multiple: true
          path: dist-release

      - name: Merge SHA256SUMS
        run: |
          set -euo pipefail
          cd dist-release
          cat SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          rm -f SHA256SUMS-*.txt
          cat SHA256SUMS.txt

      - name: Extract changelog release notes
        run: |
          node scripts/extract-release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md
          {
            echo ""
            echo "### Checksums"
            echo '```'
            cat dist-release/SHA256SUMS.txt
            echo '```'
          } >> release-notes.md
          cat release-notes.md

      - name: Create or update Draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
            gh release edit "$TAG" --draft --notes-file release-notes.md
          else
            gh release create "$TAG" dist-release/* \
              --draft \
              --title "VMK Studio ${TAG}" \
              --notes-file release-notes.md
          fi
